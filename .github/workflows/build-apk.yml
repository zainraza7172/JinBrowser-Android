name: Build Jin Browser v0.7 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'JinBrowser-Android-v0.7-source.zip'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract Jin Browser v0.7 source
        run: |
          unzip -q JinBrowser-Android-v0.7-source.zip
          test -f JinBrowser-Android/app/build.gradle
          grep -q "versionName '0.7.0'" JinBrowser-Android/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate source and test downloader, filter lists and home interaction
        working-directory: JinBrowser-Android
        run: |
          set -e
          python3 tests/project_smoke.py
          node --check tests/home-script-check.js
          node tests/home-interaction.test.js
          mkdir -p /tmp/jin-unit
          javac -d /tmp/jin-unit \
            app/src/main/java/com/jinbrowser/app/{RangeMath,DownloadProgress,MimeTypes,AdBlockRules,FilterLists}.java \
            tests/stubs/android/content/{Context,SharedPreferences}.java \
            tests/{RangeMathTest,DownloadProgressTest,MimeTypesTest,AdBlockRulesTest,FilterListsTest}.java
          for test in RangeMathTest DownloadProgressTest MimeTypesTest AdBlockRulesTest FilterListsTest; do
            java -cp /tmp/jin-unit com.jinbrowser.app.$test
          done
      - name: Compile actual Android debug APK
        working-directory: JinBrowser-Android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JinBrowser-v0.7-debug-APK
          path: JinBrowser-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
